<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="#" aria-label="Página inicial"></a>
    <nav class="site-navigation" aria-label="Navegação principal"></nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Hero</h1>
    </section>

    <section class="shoe-categories" aria-labelledby="categories-title">
      <h2 id="categories-title" class="visually-hidden">Categorias de tênis</h2>
    </section>

    <section class="featured-products" aria-labelledby="products-title">
      <h2 id="products-title" class="visually-hidden">Produtos em destaque</h2>
      <div class="products-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="contact-information"></div>
    <nav class="footer-links" aria-label="Links do rodapé"></nav>
  </footer>
</body>
</html>
