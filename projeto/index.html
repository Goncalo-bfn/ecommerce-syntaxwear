<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Tênis e Sneakers online</title>
  <!-- Estilos Globais e Base -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- Componentes -->
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/hero.css">
  <link rel="stylesheet" href="css/components/product-grid.css">
  <link rel="stylesheet" href="css/components/footer.css">
</head>

<body>
  <header class="site-header">
    <h1 class="logo">
      <a href="/">
        <img src="assets/images/logo.svg" alt="SyntaxWear - Tênis e Sneakers online">
      </a>
    </h1>
    <nav class="nav-center" aria-label="Categorias principais">
      <ul>
        <li><a href="#">Masculino</a></li>
        <li><a href="#">Feminino</a></li>
        <li><a href="#">Outlet</a></li>
      </ul>
    </nav>

    <nav class="nav-right" aria-label="Acesso rápido">
      <ul>
        <li><a href="#lojas">Nossas lojas</a></li>
        <li><a href="#sobre">Sobre</a></li>
        <li>
          <a href="#conta" aria-label="Minha conta">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="8" r="3"></circle>
              <path d="M5 20c.6-3.1 3.1-5 7-5s6.4 1.9 7 5"></path>
            </svg>
          </a>
        </li>
        <li>
          <a href="#ajuda" aria-label="Ajuda">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M9.7 9a2.4 2.4 0 1 1 4.1 1.7c-1.1 1-1.8 1.4-1.8 2.8"></path>
              <path d="M12 16.8h.01"></path>
            </svg>
          </a>
        </li>
        <li>
          <a href="#sacola" aria-label="Minha sacola">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M5 8h14v12H5z"></path>
              <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
            </svg>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
    </section>

    <section class="shoe-categories" aria-labelledby="categories-title">
      <h2 id="categories-title" class="visually-hidden">Categorias de tênis</h2>
    </section>

    <section class="featured-products" aria-labelledby="products-title">
      <h2 id="products-title" class="visually-hidden">Produtos em destaque</h2>
      <div class="products-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="contact-information"></div>
    <nav class="footer-links" aria-label="Links do rodapé"></nav>
  </footer>
</body>

</html>
